name: On Push
on: push
jobs:
  Builder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Run linting
        run: ng lint

      - name: Run tests
        run: ng test --no-watch
        
      - name: Build
        run: ng build
